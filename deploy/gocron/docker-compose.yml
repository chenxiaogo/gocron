# ============================================================
# 调度平台离线部署 docker-compose（目标机使用）
# 镜像由 start.sh 通过随包 docker save 的 tar 离线加载，不联网拉取。
# 数据/日志落在宿主机 ${HOST_DATA_DIR} / ${HOST_LOG_DIR}，与部署目录分离。
# ============================================================

services:
  scheduler:
    image: ${IMAGE_NAME:-gocron}:${SCHEDULER_IMAGE_TAG:-latest}
    container_name: gocron
    restart: unless-stopped
    ports:
      - "${SCHEDULER_HTTP_PORT:-18080}:8080"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 选中的环境配置覆盖容器内固定读取路径 /app/server/conf.d/config.yaml
      - ./${SCHED_CONFIG_FILE:-conf.d/config.prod.yaml}:/app/server/conf.d/config.yaml:ro
      # 时区使用宿主机
      - /etc/localtime:/etc/localtime:ro
      # SQLite 数据库持久化（配置 dsn=/data/scheduler.db）
      - ${HOST_DATA_DIR:-/data/gocron/data}:/data
      # 日志持久化
      - ${HOST_LOG_DIR:-/data/gocron/logs}:/app/server/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
